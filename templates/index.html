<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurolo Studio</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="studio-header">
            <div class="header-left">
                <div class="header-brand">
                    <span class="accent">AUROLO</span>
                    <span class="dim">STUDIO</span>
                </div>
                <span class="badge-pending" id="pending-badge" style="display:none">
                    <span>⏳</span>
                    <span id="pending-count">0</span> pendientes
                </span>
            </div>
            <div class="header-stats" id="stats-bar">
                <!-- Stats loaded via JS -->
            </div>
        </header>

        <!-- Main Content -->
        <main class="studio-main">
            <!-- Controls -->
            <div class="controls-bar">
                <select id="stream-select" class="stream-select">
                    <option value="">Seleccionar stream...</option>
                </select>
                <div class="filter-group">
                    <button onclick="filterClips('all')" class="filter-btn" data-filter="all">Todos</button>
                    <button onclick="filterClips('pending')" class="filter-btn" data-filter="pending">Pendientes</button>
                    <button onclick="filterClips('approved')" class="filter-btn" data-filter="approved">Aprobados</button>
                    <button onclick="filterClips('rejected')" class="filter-btn" data-filter="rejected">Rechazados</button>
                    <button onclick="filterClips('tiktok')" class="filter-btn" data-filter="tiktok">TikTok</button>
                    <button onclick="filterClips('youtube')" class="filter-btn" data-filter="youtube">YouTube</button>
                </div>
            </div>

            <!-- Clips Grid -->
            <div id="clips-grid" class="clips-grid">
                <!-- Populated by JS -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="empty-state">
                <div class="empty-icon">🎬</div>
                <p class="empty-text">Selecciona un stream para ver sus clips</p>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
